
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jinle.serialmonitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jinle.serialmonitor'
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName '2.1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
